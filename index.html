<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COIN PREDICTION | Minimal Trading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Head -->
  <header class="head">
    <div class="container flex items-center justify-between">
      <div class="brand">COIN <span class="accent">PREDICTION</span></div>
      <nav class="nav-actions">
        <a href="#" class="nav-btn">Login</a>
        <a href="#" class="nav-btn primary">Register</a>
      </nav>
    </div>
  </header>

  <!-- Coin list -->
  <section class="coins-section">
    <div class="container">
      <div class="flex justify-between items-center mb-8">
        <div>
          <span class="section-label">Markets</span>
          <h2 class="section-title">Trending coins</h2>
        </div>
        <a href="#" class="text-sm font-medium text-muted opacity-60">View all markets</a>
      </div>

      <div class="coin-grid">
        <article class="coin-card">
          <div class="coin-image">
            <img src="assets/meta-coin.jpg" alt="META COIN" />
          </div>
          <div class="coin-header">
            <span class="coin-name">META COIN</span>
            <span class="coin-tag">META</span>
          </div>
        </article>

        <article class="coin-card">
          <div class="coin-image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8L15.5 13.5L17.5 10.5"></path></svg>
          </div>
          <div class="coin-header">
            <span class="coin-name">ALPHA COIN</span>
            <span class="coin-tag">ALPHA</span>
          </div>
        </article>
      </div>
    </div>
  </section>

  <!-- Bottom navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Home</span>
    </a>
    <a href="wallet.html" class="nav-item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2" ry="2"></rect><path d="M16 2a8 8 0 0 1 8 8v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4a8 8 0 0 1 8-8z"></path></svg>
      <span>Wallet</span>
    </a>
    <a href="about.html" class="nav-item">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span>About</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
