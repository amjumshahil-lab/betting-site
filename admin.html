<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | COIN PREDICTION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========================================
       COIN PREDICTION — Minimal theme (embedded)
       ======================================== */

    :root {
      /* Deep navy / minimal palette */
      --bg: #0A0E17;
      --surface: #141B2D;
      --surface-elev: #1E293B;
      --border: #252A3A;
      --text: #FFFFFF;
      --text-muted: #8892A6;
      --text-dim: #64748B;
      --accent: #6C5CE7;
      --accent-hover: #A29BFE;
      --secondary-accent: #00CEC9;
      --up: #00CEC9;
      --down: #FF6B6B;
      --radius: 10px;
      --transition: 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      background: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* ---------- Utilities ---------- */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .flex {
      display: flex;
    }
    .items-center {
      align-items: center;
    }
    .justify-between {
      justify-content: space-between;
    }

    .text-center { text-align: center; }

    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.25rem; }
    .text-2xl { font-size: 1.5rem; }
    .text-3xl { font-size: 1.875rem; }

    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }

    .tracking-wide { letter-spacing: 0.05em; }
    .uppercase { text-transform: uppercase; }

    .opacity-60 { opacity: 0.6; }

    .mb-8 { margin-bottom: 8px; }
    .mb-16 { margin-bottom: 16px; }
    .mb-20 { margin-bottom: 20px; }
    .mb-24 { margin-bottom: 24px; }
    .mb-32 { margin-bottom: 32px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .mt-40 { margin-top: 40px; }
    .mt-80 { margin-top: 80px; }

    /* ---------- Head / Navbar ---------- */
    .head {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .head > .container {
      height: 144px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .brand .accent {
      color: var(--accent);
    }

    /* ---------- Admin section ---------- */
    .admin-section {
      padding: 80px 0 120px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--secondary-accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
    }

    /* Action buttons stacked like coin section */
    .admin-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .admin-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1.125rem;
      font-weight: 600;
      transition: all var(--transition);
      cursor: pointer;
      text-align: left;
    }

    .admin-btn:hover {
      border-color: var(--accent);
      background: var(--surface-elev);
      transform: translateY(-2px);
    }

    .admin-btn .arrow {
      font-size: 1rem;
      color: var(--text-muted);
      transition: all var(--transition);
    }

    .admin-btn:hover .arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
      .container { padding: 0 16px; }
      .admin-btn { padding: 20px 24px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Head -->
  <header class="head">
    <div class="container flex items-center justify-between">
      <a href="index.html" class="brand">COIN <span class="accent">PREDICTION</span></a>
    </div>
  </header>

  <!-- Admin Panel -->
  <section class="admin-section">
    <div class="container">
      <div>
        <span class="section-label">Admin Panel</span>
        <h1 class="section-title">Manage Platform</h1>
      </div>

      <div class="admin-actions">
        <button class="admin-btn">
          <span>Manage Users</span>
          <span class="arrow">›</span>
        </button>
        <button class="admin-btn">
          <span>Manage Coins</span>
          <span class="arrow">›</span>
        </button>
        <button class="admin-btn">
          <span>Wallet</span>
          <span class="arrow">›</span>
        </button>
        <button class="admin-btn">
          <span>Dashboard</span>
          <span class="arrow">›</span>
        </button>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
